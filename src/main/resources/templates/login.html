<!DOCTYPE HTML>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie - JKM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:rel="stylesheet" th:href="@{/css/style.css}"/>

    <script>
        history.replaceState('data', 'Title', "/");
    </script>
</head>
<body style="background-color: var(--imperial-white);">

<nav class="navbar navbar-expand-lg navbar-custom static-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-bus-front"></i> JKM - Powrót
        </a>
    </div>
</nav>

<div class="container login-container">

    <div class="login-card">

        <div class="login-header">
            <h3>Zaloguj się</h3>
            <p class="mb-0" style="opacity: 0.9; font-size: 0.9rem;">Dostęp do systemu JKM</p>
        </div>

        <div class="login-body">

            <div th:if="${param.error}" class="alert alert-danger text-center p-2 mb-3" style="font-size: 0.9rem;">
                Błędny login lub hasło!
            </div>
            <div th:if="${param.logout}" class="alert alert-success text-center p-2 mb-3" style="font-size: 0.9rem;">
                Wylogowano pomyślnie.
            </div>

            <form method="post" th:action="@{/login}">

                <div class="mb-3">
                    <label for="login" class="form-label fw-bold" style="color: var(--shinto-green);">Nazwa użytkownika</label>
                    <input id="login" type="text" placeholder="Wpisz login" autocomplete="off"
                           class="form-control" name="username" required autofocus/>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-bold" style="color: var(--shinto-green);">Hasło</label>
                    <input id="password" type="password" placeholder="Wpisz hasło" autocomplete="off"
                           class="form-control" name="password" required/>
                </div>

                <div class="d-grid">
                    <button class="btn btn-login" type="submit">Zaloguj się</button>
                </div>
            </form>

            <div class="text-center mt-4">
                <a th:href="@{/}" style="color: var(--shinto-green); text-decoration: none; font-size: 0.9rem;">
                    &larr; Wróć na stronę główną
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
