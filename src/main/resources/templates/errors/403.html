<!DOCTYPE HTML>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Błąd 403 - JKM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom static-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-bus-front"></i> JKM - System
        </a>
    </div>
</nav>

<div class="container login-container">
    <div class="login-card">
        <div class="login-header" style="background-color: #dc3545;"> <h3><i class="bi bi-shield-lock-fill"></i> Błąd 403</h3>
            <p class="mb-0">Dostęp zabroniony</p>
        </div>
        <div class="login-body text-center">
            <h5 class="mb-3">Brak uprawnień</h5>
            <p class="text-muted">Niestety, nie posiadasz wystarczających uprawnień, aby wyświetlić tę stronę.</p>

            <div class="d-grid gap-2 mt-4">
                <a href="/" class="btn btn-login">Wróć na stronę główną</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-secondary w-100">Wyloguj i zaloguj jako inny użytkownik</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
